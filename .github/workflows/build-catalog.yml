name: Build Bulgaria vehicle catalog
on:
  workflow_dispatch:
    inputs:
      refresh_variants:
        description: "Refresh all commercial variants"
        required: false
        default: "true"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - "refresh-catalog.trigger"
      - ".github/workflows/build-catalog.yml"
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: write
concurrency:
  group: vehicle-catalog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import verified commercial variants
        if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
        run: python scripts/import_fleetbyte_variants.py
      - name: Build catalog
        run: python scripts/build_catalog.py
      - name: Validate picker contract
        run: python scripts/validate_catalog.py
      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          test ! -f data/fleetbyte-variants.csv || git add data/fleetbyte-variants.csv
          git diff --cached --quiet || git commit -m "data: refresh all-brand vehicle variants"
          git pull --rebase origin main
          git push
