name: Build Bulgaria vehicle catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - ".github/workflows/build-catalog.yml"
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: write
concurrency:
  group: vehicle-catalog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import verified commercial variants
        run: python scripts/import_fleetbyte_variants.py
      - name: Build catalog
        run: python scripts/build_catalog.py
      - name: Validate picker contract
        run: python scripts/validate_catalog.py
      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fleetbyte-variants.csv dist
          git diff --cached --quiet || git commit -m "data: refresh all-brand vehicle variants"
          git pull --rebase origin main
          git push
